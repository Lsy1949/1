<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 多租户防首帧闪烁：主 JS 执行前用 localStorage 缓存的品牌色覆盖初始变量。
         key 由 tenant store applyConfig 写入；无缓存 / 读取异常则静默跳过（走 brand.css 默认值）。 -->
    <script>
      ;(function () {
        try {
          var c = localStorage.getItem('tenant:brand-primary')
          if (c) document.documentElement.style.setProperty('--brand-primary', c)
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="生涯心旅 - 为大学生提供专业的心理健康服务、生涯规划指导与活动中心，结合 AI 技术与专业咨询，用心呵护每一份成长。" />
    <meta name="keywords" content="生涯心旅,心理健康,心理咨询,生涯规划,心理测评,时光胶囊,大学生成长" />
    <meta name="theme-color" content="#0052d9" />
    <meta name="author" content="生涯心旅团队" />
    <!-- Open Graph 社交分享 -->
    <meta property="og:title" content="生涯心旅" />
    <meta property="og:description" content="专业的心理健康服务与活动中心指导，用心呵护每一份成长" />
    <meta property="og:type" content="website" />
    <!-- 杂志风字体：Playfair Display + Noto Serif SC + Noto Sans SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>生涯心旅 - 心理健康与生涯规划服务平台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
