    <!-- 防首帧闪烁：主 JS 执行前用 localStorage 缓存预设 data-palette / dark class / color-scheme。
         - palette：按租户隔离（theme:palette:{tenantId}），同时读取品牌色兜底
         - mode：全局明暗偏好（theme:mode），兼容 system
         - 读取失败 / 缺失时静默走 palettes.css 的 :root fallback（blue）
         - 与 src/hooks/useTheme.ts 的键位严格保持一致 -->
    <script>
      ;(function () {
        try {
          var root = document.documentElement

          // 1) 解析当前租户（与 src/config/tenant/resolve.ts 同序）：
          //    子域名 > VITE_TENANT_ID（构建期，本脚本不可见） > ?tenant=xxx > 'default'
          //    内联脚本只能覆盖 ?tenant=xxx 与默认；子域名 / env 由运行时补齐
          var tenantId = 'default'
          var urlTid = new URLSearchParams(location.search).get('tenant')
          if (urlTid && /^[a-z0-9][a-z0-9_-]*$/i.test(urlTid)) tenantId = urlTid
          else {
            var sub = location.hostname.split('.')[0]
            if (sub && sub !== 'www' && /^[a-z0-9][a-z0-9_-]*$/i.test(sub)) tenantId = sub
          }

          // 2) palette：用户偏好 > 品牌色缓存兜底
          var palette = localStorage.getItem('theme:palette:' + tenantId)
          if (palette && /^(blue|green|purple|orange)$/.test(palette)) {
            root.dataset.palette = palette
          } else {
            root.dataset.palette = 'blue'
          }

          // 3) mode：light | dark | system
          var mode = localStorage.getItem('theme:mode') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) root.classList.add('dark')
          root.style.colorScheme = dark ? 'dark' : 'light'

          // 4) 品牌色兜底：palette 派生前先用上一次缓存的 brand-primary
          var brandPrimary = localStorage.getItem('tenant:brand-primary')
          if (brandPrimary) root.style.setProperty('--brand-primary', brandPrimary)
        } catch (e) {
          /* localStorage 不可用（隐私模式）时静默走 fallback */
        }
      })()
    </script>
